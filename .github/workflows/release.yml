name: Publicar release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar"
        required: true
        default: "v1.2.0"
        type: string

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verificar tag e artefatos
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test -f "docs/release_${RELEASE_TAG}.md"
          test -f output/pdf/Template_TCC_UEMG_revisado.pdf

      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Pipeline de Dados Educacionais ${RELEASE_TAG}" \
              --notes-file "docs/release_${RELEASE_TAG}.md"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Pipeline de Dados Educacionais ${RELEASE_TAG}" \
              --notes-file "docs/release_${RELEASE_TAG}.md"
          fi

          gh release upload "${RELEASE_TAG}" \
            output/pdf/Template_TCC_UEMG_revisado.pdf \
            --clobber

          for artefato in \
            tcc/apresentacao/Defesa_TCC_evidencias_integradas.pptx \
            tcc/apresentacao/Roteiro_impresso_defesa_TCC.docx; do
            if test -f "${artefato}"; then
              gh release upload "${RELEASE_TAG}" "${artefato}" --clobber
            fi
          done
