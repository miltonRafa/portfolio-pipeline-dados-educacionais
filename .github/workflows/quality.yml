name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download dependencies
        run: python -m pip install "requests>=2.32" "pandas>=2.2" "openpyxl>=3.1" "xlrd>=2.0" "pyxlsb>=1.0"

      - name: Compile Python files
        run: python -m compileall -q src scripts tests

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v

      - name: List pipeline commands
        run: python src/pipeline.py --list

      - name: Validate full pipeline dry-run
        run: python src/pipeline.py full --dry-run
