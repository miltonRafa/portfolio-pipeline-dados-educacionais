name: Quality

on:
  push:
    branches:
      - main
      - correcoes-auditoria-tcc
      - 'integration/**'
  pull_request:
    branches:
      - main

jobs:
  repository-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python files
        run: python -m compileall -q src scripts tests

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v

      - name: List pipeline commands
        run: python src/pipeline.py --list

      - name: Validate full pipeline dry-run
        run: python src/pipeline.py full --dry-run
